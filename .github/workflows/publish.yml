# TRACEWEAVER: file-role=protected-readonly-publisher-caller; req=REQ-PUB-004; trace=TRACE-PUB-004; ver=VER-PUB-004
name: Validate reviewed exporter artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful source CI run ID
        required: true
        type: string
      run_attempt:
        description: Exact successful source run attempt
        required: true
        type: string
      artifact_id:
        description: Exact artifact ID from that source run
        required: true
        type: string
      sha:
        description: Exact 40-character source commit SHA
        required: true
        type: string
      branch:
        description: Protected source branch
        required: true
        type: choice
        options: [dev, main]
permissions:
  contents: read
concurrency:
  group: dc-exporter-validation
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.repository == 'cryptolabsza/dc-exporter-releases' &&
      github.repository_id == '1141480624' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.workflow_ref == 'cryptolabsza/dc-exporter-releases/.github/workflows/publish.yml@refs/heads/main'
    # PREPARATION PLACEHOLDER: root replaces this with reviewed recipe H1 SHA.
    # Recipe runs --validate-only in ci-publish-ephemeral; no writable job exists.
    uses: cryptolabsza/dc-exporter-releases/.github/workflows/dc-exporter-publish.yml@1111111111111111111111111111111111111111
    with:
      run_id: ${{ inputs.run_id }}
      run_attempt: ${{ inputs.run_attempt }}
      artifact_id: ${{ inputs.artifact_id }}
      sha: ${{ inputs.sha }}
      branch: ${{ inputs.branch }}
    secrets:
      DC_EXPORTER_SOURCE_READER_APP_KEY: ${{ secrets.DC_EXPORTER_SOURCE_READER_APP_KEY }}
