# TRACEWEAVER: file-role=protected-publisher-caller; req=REQ-PUB-004; trace=TRACE-PUB-004; ver=VER-PUB-004
name: Protected exporter artifact publisher
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only by default; writes require separate exact owner approval
        required: true
        type: choice
        default: validate
        options:
        - validate
        - publish
        - recover
      run_id:
        description: Successful source CI run ID
        required: false
        type: string
      run_attempt:
        description: Exact successful source run attempt
        required: false
        type: string
      artifact_id:
        description: Exact artifact ID from that source run
        required: false
        type: string
      sha:
        description: Exact 40-character source commit SHA
        required: false
        type: string
      branch:
        description: 'Source branch: dev or main; leave empty for recovery'
        required: false
        type: string
      recover_stage_id:
        description: Recorded target release stage ID; recovery only
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: dc-exporter-release-channel
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.repository == 'cryptolabsza/dc-exporter-releases' &&
      github.repository_id == '1141480624' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.workflow_ref == 'cryptolabsza/dc-exporter-releases/.github/workflows/publish.yml@refs/heads/main' &&
      inputs.mode == 'validate' &&
      inputs.run_id != '' && inputs.run_attempt != '' && inputs.artifact_id != '' && inputs.sha != '' && inputs.branch != '' && inputs.recover_stage_id
      == ''
    uses: cryptolabsza/dc-exporter-releases/.github/workflows/dc-exporter-publish.yml@4018e103c156eb3c4cb43504d770158d477d2ff7
    with:
      mode: validate
      run_id: ${{ inputs.run_id }}
      run_attempt: ${{ inputs.run_attempt }}
      artifact_id: ${{ inputs.artifact_id }}
      sha: ${{ inputs.sha }}
      branch: ${{ inputs.branch }}
    secrets:
      DC_EXPORTER_SOURCE_READER_APP_KEY: ${{ secrets.DC_EXPORTER_SOURCE_READER_APP_KEY }}
    permissions:
      contents: read
  publish:
    if: >-
      github.repository == 'cryptolabsza/dc-exporter-releases' &&
      github.repository_id == '1141480624' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.workflow_ref == 'cryptolabsza/dc-exporter-releases/.github/workflows/publish.yml@refs/heads/main' &&
      inputs.mode == 'publish' &&
      inputs.run_id != '' && inputs.run_attempt != '' && inputs.artifact_id != '' && inputs.sha != '' && inputs.branch != '' && inputs.recover_stage_id
      == '' && inputs.branch == 'dev'
    uses: cryptolabsza/dc-exporter-releases/.github/workflows/dc-exporter-publish.yml@4018e103c156eb3c4cb43504d770158d477d2ff7
    with:
      mode: publish
      run_id: ${{ inputs.run_id }}
      run_attempt: ${{ inputs.run_attempt }}
      artifact_id: ${{ inputs.artifact_id }}
      sha: ${{ inputs.sha }}
      branch: ${{ inputs.branch }}
    secrets:
      DC_EXPORTER_SOURCE_READER_APP_KEY: ${{ secrets.DC_EXPORTER_SOURCE_READER_APP_KEY }}
    permissions:
      contents: write
  recover:
    if: >-
      github.repository == 'cryptolabsza/dc-exporter-releases' &&
      github.repository_id == '1141480624' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.workflow_ref == 'cryptolabsza/dc-exporter-releases/.github/workflows/publish.yml@refs/heads/main' &&
      inputs.mode == 'recover' &&
      inputs.run_id == '' && inputs.run_attempt == '' && inputs.artifact_id == '' && inputs.sha == '' && inputs.branch == '' && inputs.recover_stage_id
      != ''
    uses: cryptolabsza/dc-exporter-releases/.github/workflows/dc-exporter-publish.yml@4018e103c156eb3c4cb43504d770158d477d2ff7
    with:
      mode: recover
      recover_stage_id: ${{ inputs.recover_stage_id }}
    permissions:
      contents: write
